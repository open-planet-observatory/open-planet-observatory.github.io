# Collects every feed, builds the page and publishes it to Cloudflare Pages (once set up) and GitHub Pages.
# Runs every 10 minutes. Each source has its own refresh interval (collector/snap.mjs, collector/collect.mjs);
# anything not due, or anything that fails, keeps its last good value from the live site.
name: Collect and publish

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 'true' when the Cloudflare Pages token secret exists (a step's `if` can't read secrets; the token itself stays out of the other steps)
      HAS_CF_PAGES: ${{ secrets.CF_PAGES_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Collect data
        env:
          # Optional repository secrets. Without them the collector uses the shared demo keys.
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          CLOUDFLARE_RADAR_TOKEN: ${{ secrets.CLOUDFLARE_RADAR_TOKEN }}
          # NASA Earthdata Login (free) for GRACE-FO ice and water data from PO.DAAC.
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          # The live site, so a failed source keeps its last good data.
          PREV_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: node collector/collect.mjs dist/data
      - name: Data checks
        # removes any series whose latest value is missing (shown as "no data"), fails on a file that doesn't parse
        run: node collector/sanitize.mjs dist/data
      - name: Build page
        env:
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          # Address of the games server (worker/), a repository variable; empty = boards switched off
          OWL_API: ${{ vars.OWL_API }}
        run: node build/build.mjs hosted dist/data dist
      - name: Cache the test browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.63.0
      - name: Start-up gate
        # opens the built site in a real browser; if the app layout doesn't start, nothing is published and the last good site stays up
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/smoke.mjs dist
      - name: Publish to Cloudflare Pages
        # Cloudflare Pages (project "theowlmanac", Direct Upload) becomes the main host once the domain's nameservers move to
        # Cloudflare; GitHub Pages (below) keeps publishing the same gated build as the fallback, so a Cloudflare failure
        # never stops the GitHub copy. Skipped until the CF_PAGES_TOKEN secret (Account > Cloudflare Pages: Edit only) exists.
        # The games server's CLOUDFLARE_API_TOKEN is a different token and is not used here.
        # Cadence: every run (10 min). Direct Upload deploys are not Git builds, so they don't use the free plan's
        # 500 builds a month. If Cloudflare ever limits deploys, set the repository variable CF_PAGES_CADENCE=hourly:
        # scheduled runs then publish to Cloudflare only in the first 10 minutes of each hour; pushes and manual runs always do.
        if: ${{ env.HAS_CF_PAGES == 'true' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CADENCE: ${{ vars.CF_PAGES_CADENCE }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$CADENCE" = "hourly" ] && [ "$EVENT" = "schedule" ] && [ "$(date -u +%M)" -ge 10 ]; then
            echo "CF_PAGES_CADENCE=hourly: not this run"; exit 0
          fi
          if npx --yes wrangler@3 pages deploy dist --project-name=theowlmanac --branch=main --commit-dirty=true; then
            echo "Published to Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Cloudflare Pages::Publishing to Cloudflare Pages failed; GitHub Pages still publishes this build."
            echo "Cloudflare Pages publish FAILED (GitHub Pages still publishes)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
