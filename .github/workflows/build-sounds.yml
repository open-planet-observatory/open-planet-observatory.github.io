# Builds the space-sound clips (src/assets/sounds/<id>.mp3 + built.json) from the NASA and Chandra files listed in
# src/assets/sounds/sounds.json, and commits them. Runs when that list changes, or by hand from the Actions tab.
# NASA audio is generally not subject to copyright in the US; Chandra asserts no copyright; credits are kept in the list.
name: Build space sounds

on:
  push:
    branches: [main]
    paths: ['src/assets/sounds/sounds.json', 'collector/build-sounds.mjs']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: build-sounds
  cancel-in-progress: false

jobs:
  sounds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build the clips
        run: node collector/build-sounds.mjs src/assets/sounds
      - name: Propose the rebuilt files as a pull request (main is protected)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/open-pr.sh "Space sounds: clips built from NASA and Chandra files" src/assets/sounds
